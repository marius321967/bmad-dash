# Inert in the monorepo (apps/bmad-dash). After the mirror workflow
# (.github/workflows/mirror-bmad-dash.yml) rewrites the subtree to the public
# repo root, this becomes the public repo's release pipeline.
#
# On every push to main: publish to the VS Code Marketplace and Open VSX, tag
# the release, and create a GitHub Release with the packaged .vsix attached.
#
# Version policy: the latest GitHub release is the patch-number source of
# truth. If package.json's version is ahead of the latest release (a manual
# major/minor bump via the monorepo), it is published as-is; otherwise the
# release version is <latest release patch>+1. Nothing is committed or pushed
# to main — the repo's ruleset requires changes via PR, so direct pushes are
# rejected, and tag pushes do not retrigger this workflow.
#
# No verify steps here by design: main only advances through mirror PRs that
# auto-merge once ci.yml is green, so everything landing on main is verified.
#
# Requires a VSCE_PAT secret on the public repo: an Azure DevOps Personal
# Access Token with the 'Marketplace > Manage' scope for the publisher
# (whisker-studio). Also requires an OPENVSX_TOKEN secret for the Open VSX
# registry.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' | node -e '
          const input = require("fs").readFileSync(0, "utf8").trim().replace(/^v/, "");
          const pkg = require("./package.json");
          const cmp = (a, b) => {
            const pa = a.split("-")[0].split(".").map(Number);
            const pb = b.split("-")[0].split(".").map(Number);
            for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pa[i] - pb[i];
            return 0;
          };
          if (!input) {
            console.error(`No prior release; publishing ${pkg.version} as-is`);
            console.log(pkg.version);
          } else if (cmp(pkg.version, input) > 0) {
            console.error(`${pkg.version} is ahead of the latest release (${input}); publishing as-is`);
            console.log(pkg.version);
          } else {
            const [maj, min, pat] = input.split("-")[0].split(".").map(Number);
            const next = `${maj}.${min}.${pat + 1}`;
            console.error(`Latest release: ${input}; releasing ${next}`);
            console.log(next);
          }
          ')
          npm version "$RELEASE_VERSION" --no-git-tag-version
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - run: npm run build

      - name: Package VSIX
        # dist/package.json makes npm treat dist as the project root, so
        # 'npx --no-install' run from dist cannot see the root node_modules.
        # Invoke the vsce bin directly by path instead.
        run: |
          cd dist
          node ../node_modules/@vscode/vsce/vsce package --no-dependencies --baseImagesUrl https://raw.githubusercontent.com/the-whisker-studio/bmad-dash/main

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: bmad-dash-v${{ steps.version.outputs.version }}.vsix
          path: dist/*.vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          cd dist
          node ../node_modules/@vscode/vsce/vsce publish --no-dependencies --baseImagesUrl https://raw.githubusercontent.com/the-whisker-studio/bmad-dash/main -p "$VSCE_PAT"

      - name: Publish to Open VSX
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}
        run: |
          cd dist
          npx --yes ovsx publish *.vsix -p "$OPENVSX_TOKEN"

      - name: Tag release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null || git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" dist/*.vsix \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

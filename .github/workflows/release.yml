# Inert in the monorepo (apps/bmad-dash). After the mirror workflow
# (.github/workflows/mirror-bmad-dash.yml) rewrites the subtree to the public
# repo root, this becomes the public repo's release pipeline.
#
# On every push to main: publish to the VS Code Marketplace and tag the
# release.
#
# Version policy: the marketplace is the patch-number source of truth. If
# package.json's version is ahead of the marketplace (a manual major/minor
# bump via the monorepo), it is published as-is; otherwise the release
# version is <latest published patch>+1. Nothing is committed or pushed to
# main — the repo's ruleset requires changes via PR, so direct pushes are
# rejected, and tag pushes do not retrigger this workflow.
#
# No verify steps here by design: main only advances through mirror PRs that
# auto-merge once ci.yml is green, so everything landing on main is verified.
#
# Requires a VSCE_PAT secret on the public repo: an Azure DevOps Personal
# Access Token with the 'Marketplace > Manage' scope for the publisher
# (whisker-studio).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Determine release version
        id: version
        run: |
          RELEASE_VERSION=$(npx --no-install @vscode/vsce show whisker-studio.bmad-dash --json | node -e '
          const show = JSON.parse(require("fs").readFileSync(0, "utf8"));
          const pkg = require("./package.json");
          const cmp = (a, b) => {
            const pa = a.split("-")[0].split(".").map(Number);
            const pb = b.split("-")[0].split(".").map(Number);
            for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pa[i] - pb[i];
            return 0;
          };
          const latest = show.versions.map(v => v.version).sort((a, b) => cmp(b, a))[0];
          if (cmp(pkg.version, latest) > 0) {
            console.error(`${pkg.version} is ahead of the marketplace (${latest}); publishing as-is`);
            console.log(pkg.version);
          } else {
            const [maj, min, pat] = latest.split("-")[0].split(".").map(Number);
            const next = `${maj}.${min}.${pat + 1}`;
            console.error(`Latest published: ${latest}; releasing ${next}`);
            console.log(next);
          }
          ')
          npm version "$RELEASE_VERSION" --no-git-tag-version
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - run: npm run build

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # dist/package.json makes npm treat dist as the project root, so
        # 'npx --no-install' run from dist cannot see the root node_modules.
        # Invoke the vsce bin directly by path instead.
        run: |
          cd dist
          node ../node_modules/@vscode/vsce/vsce publish --no-dependencies --baseImagesUrl https://raw.githubusercontent.com/the-whisker-studio/bmad-dash/main -p "$VSCE_PAT"

      - name: Tag release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null || git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
